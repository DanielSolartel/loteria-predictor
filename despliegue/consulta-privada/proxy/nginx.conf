# Fase 10 (E10.2): proxy de la consulta privada (DEMOSTRACION con PKI de prueba). Unico punto de entrada.
#
# - TLS con el certificado del servidor y, para cada persona, CERTIFICADO DE CLIENTE emitido por la CA de
#   consulta (separada de las cuentas de la consola de E10.1). Sin certificado valido, revocado (CRL) o de
#   otra CA: 400 y nada llega a la pasarela.
# - La identidad es el CN verificado, solo si el sujeto es exactamente `CN=<identidad>`.
# - El proxy REEMPLAZA las cabeceras de identidad e ingreso que envie el cliente (proxy_set_header con el
#   mismo nombre: nginx no reenvia la del cliente) y vacia X-Forwarded-For, Forwarded y X-Real-IP.
# - El secreto del ingreso llega en un archivo montado en ejecucion (`secretos/ingreso.conf`).
# - Revocar: nueva CRL y `nginx -s reload` (sin reiniciar el contenedor).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    server_tokens off;
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    # Registro sin consulta (`$uri`, no `$request_uri`) ni cabeceras.
    log_format consulta '$time_iso8601 $ssl_client_verify cn=$identidad $request_method $uri $status';
    access_log /dev/stdout consulta;

    map $ssl_client_s_dn $identidad {
        "~^CN=(?<cn>[a-z0-9][a-z0-9-]{1,62})$" $cn;
        default "";
    }
    map $http_host $host_admitido {
        "consulta.e102.prueba:18443" 1;
        default 0;
    }
    # Limite grueso por certificado (la cuota por persona y la agregada las aplica la pasarela).
    limit_req_zone $ssl_client_serial zone=por_certificado:1m rate=20r/s;
    limit_req_status 429;

    server {
        listen 18443 ssl;
        server_name consulta.e102.prueba;
        ssl_certificate /etc/nginx/tls/servidor.crt;
        ssl_certificate_key /etc/nginx/tls/servidor.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate /etc/nginx/tls/ca-consulta.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        ssl_crl /etc/nginx/tls/crl.pem;

        if ($host_admitido = 0) { return 421; }
        if ($identidad = "") { return 403; }

        location / {
            limit_req zone=por_certificado burst=40 nodelay;
            proxy_pass http://pasarela_interna;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Consulta-Identidad $identidad;
            include /etc/nginx/secretos/ingreso.conf;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_read_timeout 20s;
            proxy_connect_timeout 3s;
        }
    }

    upstream pasarela_interna {
        include /etc/nginx/generado/pasarela.conf;  # server <IP fija de la pasarela en la red interna>:8020;
    }
}
