# AE-76: validacion automatica con Python 3.14 en Linux y Windows. Ya se ejecuta en
# GitHub Actions en cada push a main/develop y en cada PR (p. ej. la ejecucion 45 sobre
# c7644c4: Linux suite completa y Windows seleccion, ambos verdes, OpenSSL 7/7).
# Sin secretos, sin despliegue y sin descargar ejecutables: usa el OpenSSL que ya
# trae cada imagen del runner. Los siete contrastes con `openssl ts -verify` se
# cuentan desde el informe JUnit real; una omision nunca se presenta como exito.
name: Validacion Python 3.14

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux - suite completa
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Dependencias fijadas
        run: python -m pip install -r requirements.txt
      # httpx no es dependencia declarada del proyecto: las pruebas HTTP con TestClient
      # lo importan con pytest.importorskip. Se fija a la version validada por el operador
      # para que la suite completa no tenga omisiones ajenas.
      - name: Dependencia de pruebas HTTP
        run: python -m pip install httpx==0.28.1
      - name: Comprobacion de dependencias
        run: python -m pip check
      - name: OpenSSL del runner
        run: openssl version
      - name: Suite completa
        run: python -m pytest -p no:cacheprovider -rsw --junitxml=../resultados-linux.xml
      - name: Contrastes con openssl ts -verify (deben pasar los siete)
        run: python scripts/ci_contrastes_openssl.py ../resultados-linux.xml --modo exigir --resumen "$GITHUB_STEP_SUMMARY"
      # AE-79: la auditoria cruzada de extremo a extremo, con el comando real sobre
      # directorios temporales y material de fixture (sin red ni secretos).
      - name: Demostracion AE-79 de extremo a extremo
        run: python -m tests.demostracion_auditoria_cruzada
      # AE-80: constancias de la auditoria cruzada verificadas con el comando real.
      - name: Demostracion AE-80 de extremo a extremo
        run: python -m tests.demostracion_constancias_auditoria

      - name: Demostracion AE-81 de extremo a extremo
        run: python -m tests.demostracion_publicacion_constancias
      # Producto 6: centro de resultados en los cuatro juegos (datos sinteticos, sin red ni base).
      - name: Demostracion de Producto 6 (resultados de los modelos)
        run: python -m tests.demostracion_producto6
      # Fase 5: estadisticas descriptivas completas en los cuatro juegos (datos sinteticos, sin red ni base).
      - name: Demostracion de la Fase 5 (estadisticas descriptivas)
        run: python -m tests.demostracion_fase5
      # Fase 3: comparar, entrenar, guardar, recargar y generar sin reentrenar en los cuatro
      # juegos, con procesos trabajadores reales (datos sinteticos, sin red ni base).
      - name: Demostracion de la Fase 3 (modelos registrados)
        run: python -m tests.demostracion_fase3
      # Fase 4: generar con la configuracion, explicar (importancias en el proceso trabajador
      # real) y fiabilidad observada con su intervalo (datos sinteticos, sin red ni base).
      - name: Demostracion de la Fase 4 (predicciones explicables)
        run: python -m tests.demostracion_fase4

  windows:
    name: Windows - seleccion de tests/seleccion_windows.txt
    runs-on: windows-2025
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Dependencias fijadas
        run: python -m pip install -r requirements.txt
      - name: Dependencia de pruebas HTTP
        run: python -m pip install httpx==0.28.1
      - name: Comprobacion de dependencias
        run: python -m pip check
      - name: OpenSSL en PATH (informativo; no se instala nada)
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if ($openssl) { "OpenSSL en PATH: $($openssl.Source)"; openssl version }
          else { "OpenSSL no esta en PATH: los contrastes quedaran OMITIDOS y no cuentan como superados" }
      - name: Seleccion Windows
        run: |
          $rutas = Get-Content tests/seleccion_windows.txt | Where-Object { $_ }
          python -m pytest -p no:cacheprovider -rsw --junitxml=../resultados-windows.xml @rutas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contrastes con openssl ts -verify (siete superados o siete omitidos, con estado explicito)
        run: python scripts/ci_contrastes_openssl.py ../resultados-windows.xml --modo permitir_omision --resumen $env:GITHUB_STEP_SUMMARY
      - name: Demostracion AE-79 de extremo a extremo
        run: |
          python -m tests.demostracion_auditoria_cruzada
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Demostracion AE-80 de extremo a extremo
        run: |
          python -m tests.demostracion_constancias_auditoria
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Demostracion AE-81 de extremo a extremo
        run: |
          python -m tests.demostracion_publicacion_constancias
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Demostracion de Producto 6 (resultados de los modelos)
        run: |
          python -m tests.demostracion_producto6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Demostracion de la Fase 5 (estadisticas descriptivas)
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m tests.demostracion_fase5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Demostracion de la Fase 3 (modelos registrados)
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m tests.demostracion_fase3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Demostracion de la Fase 4 (predicciones explicables)
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m tests.demostracion_fase4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
