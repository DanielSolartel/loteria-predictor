{% extends "base.html" %}
{% block title %}Sorteos{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">Sorteos</h3>
    <a href="/sorteos/nuevo{% if juego_seleccionado %}?juego={{ juego_seleccionado }}{% endif %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Registrar sorteo
    </a>
</div>

<div class="card stat-card p-3 mb-3">
    <form class="row g-2 align-items-end" hx-get="/sorteos/tabla" hx-target="#tabla-sorteos" hx-push-url="/sorteos">
        <div class="col-auto">
            <label class="form-label small text-muted mb-1">Juego</label>
            <select name="juego" class="form-select form-select-sm" onchange="this.form.requestSubmit()">
                <option value="">Todos</option>
                {% for j in juegos %}
                <option value="{{ j.codigo }}" {% if j.codigo == juego_seleccionado %}selected{% endif %}>{{ j.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </form>
</div>

<div id="tabla-sorteos">
    {% include "sorteos/partials/tabla.html" %}
</div>

{% endblock %}
