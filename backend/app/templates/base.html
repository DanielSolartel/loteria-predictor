<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Predictivo de Loterías{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark topbar sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-dice-5-fill me-2"></i>Sistema Predictivo de Loterías
            </span>
            <span class="navbar-text text-white-50 small">
                <i class="bi bi-database-fill me-1"></i>{{ estado_db|default("Desconectado") }}
            </span>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar d-none d-md-block">
            <ul class="nav flex-column pt-3">
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'juegos' %}active{% endif %}" href="/juegos">
                        <i class="bi bi-joystick me-2"></i>Juegos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'sorteos' %}active{% endif %}" href="/sorteos">
                        <i class="bi bi-list-ol me-2"></i>Sorteos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_page == 'colores' %}active{% endif %}" href="/colores">
                        <i class="bi bi-palette-fill me-2"></i>Colores (ColorLoto)
                    </a>
                </li>
                <li class="nav-item mt-3">
                    <span class="nav-link disabled text-muted small text-uppercase">Próximamente</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled"><i class="bi bi-bar-chart-fill me-2"></i>Estadísticas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled"><i class="bi bi-cpu-fill me-2"></i>Modelos ML</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled"><i class="bi bi-graph-up me-2"></i>Simulaciones</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 p-4 content-area">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
